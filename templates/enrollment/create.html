<script>
    function getUrlParameter(name) {
        name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
        var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
        var results = regex.exec(location.search);
        return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    }
    
    document.addEventListener("DOMContentLoaded", function() {
        var studentId = getUrlParameter('student_id');
        if (studentId) {
            // If student_id exists, select it in the dropdown
            var studentSelect = document.getElementById('student_id');
            if (studentSelect) {
                studentSelect.value = studentId;
                
                // Hide the student selection form group
                var formGroup = studentSelect.closest('.mb-3');
                if (formGroup) {
                    formGroup.style.display = 'none';
                    
                    // Create a hidden input to ensure the student_id is still submitted
                    var hiddenInput = document.createElement('input');
                    hiddenInput.type = 'hidden';
                    hiddenInput.name = 'student_id';
                    hiddenInput.value = studentId;
                    formGroup.appendChild(hiddenInput);
                }
            }
        }
    });
    </script>
